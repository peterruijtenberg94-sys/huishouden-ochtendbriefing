name: Ochtendbriefing

on:
  schedule:
    # GitHub cron draait in UTC en kan fors vertragen. We proberen daarom elke 30 min
    # in het ochtendvenster; briefing.py verstuurt pas vanaf 08:00 lokaal en dan
    # hooguit 1x per dag (dagstatus in data/last-sent.txt). Zo blijft het dicht bij
    # 08:00 in zowel zomer- (UTC+2) als wintertijd (UTC+1), ook bij vertraging.
    - cron: "0 6 * * *"
    - cron: "30 6 * * *"
    - cron: "0 7 * * *"
    - cron: "30 7 * * *"
    - cron: "0 8 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch: {}   # handmatig draaien -> forceert direct versturen

# Bewust GEEN externe actions (geen actions/checkout of setup-python): dit account
# kan externe action-repos niet benaderen. We halen het script met curl op van de
# raw-URL en draaien het met de voorgeïnstalleerde python3 van de runner.
permissions:
  contents: write   # nodig om de dagstatus (data/last-sent.txt) te schrijven

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Verstuur ochtendbriefing
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          HUISHOUDEN_CONFIG: ${{ secrets.HUISHOUDEN_CONFIG }}
          GH_TOKEN: ${{ github.token }}
          # Handmatige run (workflow_dispatch) forceert versturen, ongeacht het uur/dagstatus:
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          PYTHONIOENCODING: "utf-8"
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/briefing.py" -o briefing.py
          python3 briefing.py
