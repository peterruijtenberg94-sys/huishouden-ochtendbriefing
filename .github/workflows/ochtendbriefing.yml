name: Ochtendbriefing

on:
  schedule:
    # GitHub cron draait in UTC. 08:00 Europe/Amsterdam is:
    - cron: "0 6 * * *"   # zomertijd (CEST, UTC+2) -> 08:00 lokaal
    - cron: "0 7 * * *"   # wintertijd (CET, UTC+1) -> 08:00 lokaal
    # briefing.py verstuurt alleen als het lokaal 08:xx is, dus precies 1x per dag.
  workflow_dispatch: {}   # handmatig draaien -> forceert direct versturen

# Bewust GEEN externe actions (geen actions/checkout of setup-python): dit account
# kan externe action-repos niet benaderen. We halen de scripts met curl op van de
# raw-URL en draaien ze met de voorgeïnstalleerde python3 van de runner.
permissions:
  contents: write   # nodig voor de keepalive-heartbeat

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Verstuur ochtendbriefing
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          HUISHOUDEN_CONFIG: ${{ secrets.HUISHOUDEN_CONFIG }}
          # Handmatige run (workflow_dispatch) forceert versturen, ongeacht het uur:
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          PYTHONIOENCODING: "utf-8"
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/briefing.py" -o briefing.py
          python3 briefing.py

      - name: Keepalive (voorkomt uitschakelen na 60 dagen inactiviteit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/keepalive.py" -o keepalive.py
          python3 keepalive.py
